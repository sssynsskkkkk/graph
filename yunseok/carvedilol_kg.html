t-is-carvedilol#0": "Carvedilol is a beta-blocker. Beta-blockers affect the heart and circulation (blood flow through arteries and veins).\nCarvedilol is used to treat heart failure and hypertension (high blood pressure). It is also used after a heart attack that has caused your heart not to pump as well.\nCarvedilol may also be used for purposes not listed in this medication guide.\nCarvedilol is not approved for use by anyone younger than 18 years of age.", "carvedilol#warnings#0": "You should not take carvedilol if you have asthma, bronchitis, emphysema, severe liver disease, severe heart failure requiring certain IV medications, or a serious heart condition such as heart block, \"sick sinus syndrome,\" or slow heart rate (unless you have a pacemaker).\nAvoid drinking alcohol within 2 hours before or after taking extended-release carvedilol (Coreg CR). Also avoid taking medicines or other products that might contain alcohol. Alcohol may cause the carvedilol in Coreg CR to be released too quickly into the body.\nIf you are being treated for high blood pressure, keep using carvedilol even if you feel well. High blood pressure often has no symptoms. You may need to use blood pressure medication for the rest of your life.", "carvedilol#before-taking-this-medicine#0": "You should not take carvedilol if you are allergic to it, or if you have:\n- asthma, bronchitis, emphysema;\n- severe liver disease; or\n- a serious heart condition such as heart block, \"sick sinus syndrome,\" or slow heart rate (unless you have a pacemaker); or severe heart failure requiring certain IV medications.\nTo make sure carvedilol is safe for you, tell your doctor if you have:\n- diabetes (taking carvedilol can make it harder for you to tell when you have low blood sugar);\n- angina (chest pain);\n- liver or kidney disease;\n- a thyroid disorder;\n- pheochromocytoma (tumor of the adrenal gland);\n- circulation problems (such as Raynaud's syndrome); or\n- a history of allergies.\nFDA pregnancy category C. It is not known whether carvedilol will harm an unborn baby. Tell your doctor if you are pregnant or plan to become pregnant while using this medication.\nIt is not known whether carvedilol passes into breast milk or if it could harm a nursing baby. Talk with your doctor about the best way to feed your baby if you are taking carvedilol.", "carvedilol#how-should-i-take-carvedilol#0": "Take carvedilol exactly as prescribed by your doctor. Follow all directions on your prescription label. Your doctor may occasionally change your dose to make sure you get the best results. Do not take this medicine in larger or smaller amounts or for longer than recommended.\nTake carvedilol with food.\nSwallow the extended-release capsule whole and do not crush or chew it. If you have trouble swallowing, you may open the carvedilol capsule and sprinkle the medicine into a spoonful of applesauce to make swallowing easier. The applesauce should not be warm. Do not sprinkle contents on foods other than applesauce. Swallow right away without chewing. Do not save the mixture for later use. Discard the empty capsule.\nTake carvedilol at the same time every day. Do not skip doses or stop taking carvedilol without first talking to your doctor. Stopping suddenly may cause chest pain or a heart attack.", "carvedilol#what-to-avoid#0": "Carvedilol may impair your thinking or reactions. Be careful if you drive or do anything that requires you to be alert.\nDrinking alcohol can further lower your blood pressure and may increase certain side effects of carvedilol. You should especially avoid drinking alcohol within 2 hours before or after taking extended-release carvedilol (Coreg CR).\nAvoid getting up too fast from a sitting or lying position, or you may feel dizzy. Get up slowly and steady yourself to prevent a fall.", "carvedilol#carvedilol-side-effects#0": "Get emergency medical help if you have any of these signs of an allergic reaction to carvedilol: hives; difficulty breathing; swelling of your face, lips, tongue, or throat.\nCall your doctor at once if you have a serious side effect such as:\n- a light-headed feeling, like you might pass out;\n- slow or uneven heartbeats;\n- swelling, rapid weight gain, feeling short of breath (even with mild exertion);\n- cold feeling or numbness in your fingers or toes;\n- chest pain, dry cough, wheezing, chest tightness, trouble breathing; or\n- high blood sugar (increased thirst, increased urination, hunger, dry mouth, fruity breath odor, drowsiness, dry skin, blurred vision, weight loss).\nCommon carvedilol side effects may include:\n- weakness, dizziness;\n- diarrhea;\n- dry eyes;\n- tired feeling; or\n- weight gain.\nThis is not a complete list of side effects and others may occur. Call your doctor for medical advice about side effects. You may report side effects to FDA at 1-800-FDA-1088.", "carvedilol#how-should-i-take-carvedilol#1": "If you are switched from carvedilol tablets to carvedilol extended-release capsules (Coreg CR), your daily total dose of this medicine may be higher or lower than before. Older adults may be more likely to become dizzy or feel faint when switching from tablets to extended-release capsules. Follow your doctor's instructions.\nYour blood pressure will need to be checked often.\nIf you are being treated for high blood pressure, keep using this medication even if you feel well. High blood pressure often has no symptoms. You may need to use blood pressure medication for the rest of your life.\nIf you need surgery, tell the surgeon ahead of time that you are using carvedilol. You may need to stop using the medicine for a short time.\nYou should not stop using carvedilol suddenly. Stopping suddenly may cause chest pain or a heart attack.\nCarvedilol can affect your pupils during cataract surgery. Tell your eye surgeon ahead of time that you are using this medication. Do not stop using carvedilol before surgery unless your surgeon tells you to.", "carvedilol#how-should-i-take-carvedilol#2": "Carvedilol is only part of a complete program of treatment for hypertension that may also include diet, exercise, and weight control. Follow your diet, medication, and exercise routines very closely if you are being treated for hypertension.\nStore at room temperature away from moisture and heat.", "carvedilol#what-other-drugs-will-affect-carvedilol#0": "Other drugs may interact with carvedilol, including prescription and over-the-counter medicines, vitamins, and herbal products. Tell each of your health care providers about all medicines you use now and any medicine you start or stop using.\n- Check interactions\n- Compare alternatives\n- Pricing & coupons\n- Reviews (217)\n- Drug images\n- Side effects\n- Dosage information\n- Patient tips\n- During pregnancy\n- Support group\n- Drug class: non-cardioselective beta blockers\n- Breastfeeding\n- En español\nPatient resources:\nOther brands:\nCoreg\nProfessional resources:\n- Carvedilol monograph\n- Carvedilol (FDA)\n- Carvedilol Capsule (FDA)\nOther brands:\nCoreg, Coreg CR\nRelated treatment guides:\n- Atrial Fibrillation\n- High Blood Pressure\n- Left Ventricular Dysfunction\n- Heart Failure\n- Angina", "carvedilol#what-happens-if-i-miss-a-dose#0": "Take the missed dose as soon as you remember. Skip the missed dose if it is almost time for your next scheduled dose. Do not take extra medicine to make up the missed dose.", "carvedilol#what-happens-if-i-overdose#0": "Seek emergency medical attention or call the Poison Help line at 1-800-222-1222.\nOverdose symptoms may include uneven heartbeats, shortness of breath, bluish-colored fingernails, dizziness, weakness, fainting, and seizure (convulsions)."}, "relations": [{"r": "has administration instruction", "n": 37, "seed": true, "def": "The subject drug should be taken or used in the manner specified by the object entity (for example with food or at a fixed time)."}, {"r": "has serious side effect", "n": 27, "seed": true, "def": "The subject drug may erapeutic drug class specified by the object entity."}, {"r": "has brand name", "n": 2, "seed": true, "def": "The subject drug is marketed under the brand or trade name specified by the object entity."}, {"r": "has effect", "n": 2, "seed": false, "def": "The subject drug produces the therapeutic or physiological effect specified by the object entity."}, {"r": "has overdose instruction", "n": 2, "seed": true, "def": "In case of an overdose of the subject drug the patient should follow the instruction specified by the object entity."}, {"r": "has warning", "n": 2, "seed": true, "def": "The subject drug carries a safety warning or precaution about the risk or situation specified by the object entity."}, {"r": "should be avoided with", "n": 2, "seed": true, "def": "Patients taking the subject drug should avoid the substance or activity specified by the object entity."}, {"r": "has availability", "n": 1, "seed": true, "def": "The subject drug is available under the regulatory status specified by the object entity (for example prescription only or over the counter)."}, {"r": "has off label use", "n": 1, "seed": false, "def": "The subject drug is used for purposes not specifically approved or listed in the official medication guide, as specified by the object entity."}, {"r": "has storage instruction", "n": 1, "seed": true, "def": "The subject drug should be stored according to the instruction specified by the object entity."}, {"r": "not approved for", "n": 1, "seed": true, "def": "The subject drug is not approved or not recommended for use in the patient population specified by the object entity."}, {"r": "requires monitoring of", "n": 1, "seed": true, "def": "Patients taking the subject drug may need the medical test or monitoring specified by the object entity."}, {"r": "used in", "n": 1, "seed": false, "def": "The subject drug is utilized in the medical procedure or clinical context specified by the object entity."}], "groups": ["Drug", "Condition", "Side effect", "Substance / class", "Dosing", "Instruction / warning", "Other"], "light": ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#898781"], "dark": ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#898781"], "shapes": ["diamond", "dot", "dot", "triangle", "hexagon", "square", "dot"], "stats": {"nodes": 147, "edges": 150, "relations": 24, "edc": 139, "structured": 14, "status": {"mapped": 24, "direct": 111, "structured": 11, "mapped_new": 3, "enriched": 1}}}</script>
<script>
const D=JSON.parse(document.getElementById('kg-data').textContent);
const byId=new Map(D.nodes.map(n=>[n.id,n]));
const isDark=()=>document.documentElement.dataset.theme? document.documentElement.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
const pal=()=>isDark()?D.dark:D.light; const ink=()=>isDark()?{text:'#fff',text2:'#c3c2b7',edge:'#898781',surface:'#1a1a19'}:{text:'#0b0b0b',text2:'#52514e',edge:'#c3c2b7',surface:'#fcfcfb'};
const st=D.stats; document.getElementById('stats').textContent=`${st.nodes} nodes · ${st.edges} triples (EDC ${st.edc}, structured ${st.structured}) · ${st.relations} relations · status: direct ${st.status.direct||0}, mapped ${st.status.mapped||0}, enriched ${(st.status.enriched||0)+(st.status.mapped_new||0)}`;
const groupOn=D.groups.map(()=>true), relOn=new Map(D.relations.map(r=>[r.r,true]));
function drawLegend(){const L=document.getElementById('legend');L.innerHTML='<span>노드 타입</span>';D.groups.forEach((g,i)=>{const lab=document.createElement('label');lab.innerHTML=`<input type="checkbox" ${groupOn[i]?'checked':''}> <span class="sw" style="background:${pal()[i]}"></span>${g}`;lab.querySelector('input').onchange=ev=>{groupOn[i]=ev.target.checked;render();};L.appendChild(lab);});}
(function(){const m=document.getElementById('rels');D.relations.forEach(r=>{const c=document.createElement('span');c.className='chip'+(r.seed?'':' enr');c.title=r.def;c.innerHTML=`${r.r} <span class="n">${r.n}</span>`;c.onclick=()=>{relOn.set(r.r,!relOn.get(r.r));c.classList.toggle('off',!relOn.get(r.r));render();};m.appendChild(c);});
document.getElementById('relall').onclick=()=>{D.relations.forEach(r=>relOn.set(r.r,true));m.querySelectorAll('.chip').forEach(c=>c.classList.remove('off'));render();};
document.getElementById('relnone').onclick=()=>{D.relations.forEach(r=>relOn.set(r.r,false));m.querySelectorAll('.chip').forEach(c=>c.classList.add('off'));render();};})();
let network=null, selected=null;
function edgeOk(e){return relOn.get(e.r)&&groupOn[byId.get(e.s).g]&&groupOn[byId.get(e.o).g]&&(document.getElementById('struct').checked||e.src.includes('edc'));}
function render(){const P=pal(), I=ink(); const idx=[]; D.edges.forEach((e,i)=>{if(edgeOk(e)) idx.push(i);}); const ids=new Set([D.drug]); idx.forEach(i=>{ids.add(D.edges[i].s);ids.add(D.edges[i].o);});
 const q=document.getElementById('q').value.trim().toLowerCase();
 const vn=[...ids].map(id=>{const n=byId.get(id); const hit=q&&n.l.toLowerCase().includes(q); return {id, label:n.l.length>36?n.l.slice(0,34)+'…':n.l, shape:D.shapes[n.g], color:{background:P[n.g],border:hit?I.text:P[n.g],highlight:{background:P[n.g],border:I.text}}, borderWidth:hit?3:1, size:n.core?34:Math.min(22,7+2.4*Math.log2(1+n.d)), font:{color:I.text,size:n.core?16:12,face:'system-ui',bold:n.core?{color:I.text}:undefined}, title:`${n.l}\n${n.t} · ${n.d} edges`};});
 const showLabels=document.getElementById('labels').checked;
 const ve=idx.map(i=>{const e=D.edges[i]; const structOnly=!e.src.includes('edc'); return {id:i, from:e.s, to:e.o, label:showLabels?e.r:undefined, arrows:'to', dashes:structOnly?[6,4]:false, width:selected===i?3:1.2, color:{color:selected===i?I.text:I.edge,highlight:I.text,hover:I.text}, font:{color:I.text2,size:10,strokeWidth:0,align:'middle'}, smooth:{type:'continuous'}};});
 const container=document.getElementById('graph'); if(network) network.destroy();
 network=new vis.Network(container,{nodes:new vis.DataSet(vn),edges:new vis.DataSet(ve)},{physics:{solver:'forceAtlas2Based',forceAtlas2Based:{gravitationalConstant:-55,springLength:120,avoidOverlap:0.7},stabilization:{iterations:200}},interaction:{hover:true,tooltipDelay:120},nodes:{borderWidth:1}});
 network.on('click',p=>{if(p.edges.length&&!p.nodes.length){select(p.edges[0]);}});
 network.on('doubleClick',p=>{if(p.nodes.length){network.focus(p.nodes[0],{scale:1.4,animation:true});}});
 drawTable(idx); document.getElementById('ntrip').textContent=idx.length; document.getElementById('nview').textContent=`${ids.size} nodes · ${idx.length} edges in view`;}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function hl(text,obj){const t=esc(text); const o=esc(obj); if(!o) return t; const i=t.toLowerCase().indexOf(o.toLowerCase()); if(i<0) return t; return t.slice(0,i)+'<mark>'+t.slice(i,i+o.length)+'</mark>'+t.slice(i+o.length);}
function select(i){selected=i; const e=D.edges[i]; const s=byId.get(e.s).l,o=byId.get(e.o).l; const chunk=e.ch&&D.chunks[e.ch]?D.chunks[e.ch]:null;
 let head=`<b>${esc(s)}</b>  —[${esc(e.r)}]→  <b>${esc(o)}</b>\nstatus: ${e.st}${e.raw&&e.raw!==e.r?`  (raw relation "${esc(e.raw)}" → canonical "${esc(e.r)}")`:''} · source: ${e.src.join('/')} · count ${e.c}\nsection: ${esc(e.sec||'-')}\n${esc(e.url||'')}\n\n`;
 document.getElementById('evidence').innerHTML=head+(chunk?`── 추출기에 입력된 청크 (${esc(e.ch)}) ──\n`+hl(chunk,o):'(근거 텍스트 없음: 페이지 메타데이터에서 만든 구조화 트리플)');
 document.querySelectorAll('#table tr').forEach(tr=>tr.classList.toggle('sel',tr.dataset.i==i)); if(network){network.selectEdges([i]);}}
function drawTable(idx){const rows=idx.map(i=>[i,D.edges[i]]).sort((a,b)=>a[1].r.localeCompare(b[1].r)||byId.get(a[1].o).l.localeCompare(byId.get(b[1].o).l));
 let h='<table><tr><th>relation</th><th>subject → object</th><th>status</th></tr>', last=null;
 rows.forEach(([i,e])=>{h+=`<tr data-i="${i}"><td>${e.r!==last?esc(e.r):''}</td><td>${esc(byId.get(e.s).l)} → ${esc(byId.get(e.o).l)}</td><td class="hint">${e.st}</td></tr>`; last=e.r;});
 const T=document.getElementById('table'); T.innerHTML=h+'</table>'; T.querySelectorAll('tr[data-i]').forEach(tr=>tr.onclick=()=>select(+tr.dataset.i));}
['labels','struct'].forEach(id=>document.getElementById(id).onchange=render); document.getElementById('q').addEventListener('input',render);
document.getElementById('theme').onclick=()=>{document.documentElement.dataset.theme=isDark()?'light':'dark'; drawLegend(); render();};
document.getElementById('fit').onclick=()=>network&&network.fit({animation:true});
drawLegend(); render();
</script></body></html>
